 it to??'},{id:"l18",src:"Glimmerwick",text:'"you are looking for a set. the set is looking for a crowd. be a crowd."'},{id:"l19",src:"Voice note: unknown",text:"[a single sustained note that does not end. The recording is 0:00 long.]"},{id:"l20",src:"Porta-potty graffiti",text:"HALCYON RAY IS 3 RACCOONS IN A HOODIE. (still would go)"},{id:"l21",src:"Late text: Juno, 4:44 AM",text:"We're at the edge of the Sunrise stage. Saving you a spot. Don't be late."},{id:"l22",src:"Glimmerwick",text:'"The sun is a mirrorball the size of a promise. Hold out your hands."'},{id:"l23",src:"Voice note: Halcyon Ray?",text:`"...check, check. Is anyone still out there? Good. Then this one's for you."`},{id:"l24",src:"Flyer",text:"THE SET: NO TIME. NO STAGE. NO LINEUP. JUST BE THERE."},{id:"l25",src:"Late text: the 2% Phone",text:"1 new message from: crew. (Message could not be downloaded.)"},{id:"l26",src:"Porta-potty graffiti",text:"IF YOU CAN READ THIS, HYDRATE. IF YOU CAN'T, ALSO HYDRATE."},{id:"l27",src:"Afterhours",text:"The stages come back around, but the lights are a little warmer every loop. Like they're rehearsing."},{id:"l28",src:"Afterhours",text:"Somebody at the barrier is holding a sign with your name on it. When you get close it says THANK YOU."},{id:"l29",src:"Afterhours",text:"The sky has been almost-pink for an hour. Nobody minds. Everyone is facing the same way."},{id:"l30",src:"Afterhours",text:'Four phones light up at once in the crowd ahead. All of them say: "where r u. we see you."'}];function GQ(A){let Q=2166136261;for(let B=0;B<A.length;B++)Q^=A.charCodeAt(B),Q=Math.imul(Q,16777619);return Q>>>0}class HA{constructor(Q){this.s=typeof Q=="string"?GQ(Q):Q>>>0}next(){let Q=this.s=this.s+1831565813>>>0;return Q=Math.imul(Q^Q>>>15,Q|1),Q^=Q+Math.imul(Q^Q>>>7,Q|61),((Q^Q>>>14)>>>0)/4294967296}int(Q,B){return Q+Math.floor(this.next()*(B-Q+1))}pick(Q){return Q[Math.floor(this.next()*Q.length)]}chance(Q){return this.next()<Q}weighted(Q){const B=Q.reduce((g,t)=>g+t[1],0)
